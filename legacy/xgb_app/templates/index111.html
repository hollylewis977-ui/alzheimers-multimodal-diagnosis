<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AD Risk – SHAP</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>.box{min-height:220px;border:1px dashed #b8c1d1;border-radius:12px;display:flex;align-items:center;justify-content:center}</style>
</head>
<body class="container py-4">
  <h4>Quick Test Page</h4>
  <form id="f" class="row g-2 mb-3">
    {% for f in features %}
    <div class="col-6"><label class="form-label small">{{ f }}</label><input class="form-control form-control-sm" name="{{ f }}" type="number"></div>
    {% endfor %}
    <div class="col-12 d-grid"><button class="btn btn-primary" id="go" type="button">Predict</button></div>
  </form>
  <div class="mb-2" id="prob"></div>
  <div class="box"><img id="img" style="max-width:100%;display:none"><div id="msg" class="text-muted">No SHAP image.</div></div>

<script>
document.getElementById('go').onclick = async () => {
  const data = Object.fromEntries(new FormData(document.getElementById('f')).entries());
  const r = await fetch('/predict', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)});
  const j = await r.json();
  document.getElementById('prob').textContent = 'Prob: ' + (j.probability*100).toFixed(2) + '%';
  const b64 = j.shap_plot || j.shapImg || j.shap_image || j.shap || j.shap_png;
  if (b64) {
    img.src = 'data:image/png;base64,' + b64;
    img.style.display='block'; msg.style.display='none';
  } else {
    img.style.display='none'; msg.style.display='block'; msg.textContent = 'No image. ' + (j.shap_error||'');
  }
}
</script>
</body>
</html>
