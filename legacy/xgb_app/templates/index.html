<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>阿尔茨海默症多模态融合诊断</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
  <style>
    body { background: #f8fafc; }
    .card { border-radius: 1rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 1rem; }
  </style>
</head>
<body class="py-4">
<div class="container">
  <h2 class="mb-3 text-center">阿尔茨海默症 一站式融合诊断（MRI 优先 + 门控加权）</h2>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h5>单人预测</h5>
      <form id="predictForm" class="grid-2" enctype="multipart/form-data">
        {% for feature in features %}
        <div>
          <label>{{ feature }}</label>
          {% if meta[feature].kind == 'number' %}
          <input class="form-control" name="{{ feature }}" type="number" step="{{ meta[feature].step }}" />
          {% else %}
          <input class="form-control" name="{{ feature }}" type="number" step="1" />
          {% endif %}
        </div>
        {% endfor %}

        <div class="form-group">
          <label for="mriZip"><b>MRI 图像 ZIP（可选，仅 2D）</b></label>
          <input type="file" class="form-control-file" name="mri_zip" id="mriZip" accept=".zip" />
          <small class="text-muted">将同一个人的多张 MRI 切片（jpg/png）打包为 ZIP 上传。</small>
        </div>

        <div class="align-self-end">
          <button type="submit" class="btn btn-primary">预测</button>
        </div>
      </form>

      <div class="card mt-3">
        <div class="card-body">
          <h6 class="mb-2">预测结果</h6>
          <div id="singleResult" class="lead">—</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <h5>批量预测（CSV）</h5>
      <form id="batchForm" enctype="multipart/form-data" method="POST" action="/batch_predict">
        <div class="form-group">
          <label><b>上传 CSV</b></label>
          <input type="file" class="form-control-file" name="file" accept=".csv" required />
        </div>
        <div class="form-group">
          <label><b>MRI 图像 ZIP（可选）</b></label>
          <input type="file" class="form-control-file" name="mri_zip_batch" accept=".zip" />
          <small class="text-muted">建议按患者ID建立子文件夹，或以ID作为文件名前缀。</small>
        </div>
        <button type="submit" class="btn btn-success">开始批量预测</button>
      </form>
      <div class="small text-muted mt-2">* CSV 中请包含 PatientID 列以匹配 MRI 图像。</div>
    </div>
  </div>
</div>

<script>
document.getElementById('predictForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const result = document.getElementById('singleResult');
  result.textContent = '正在预测…';
  const formElem = e.currentTarget;
  const formData = new FormData(formElem);
  try {
    const res = await fetch('/predict', { method: 'POST', body: formData });
    if (!res.ok) {
      const txt = await res.text();
      throw new Error(txt);
    }
    const data = await res.json();
    const pred = Number(data.prediction) === 1;
    const p = Number(data.probability || 0) * 100;
    const pmri = Number(data.mri_probability || 0) * 100;
    const pxgb = Number(data.xgb_probability || 0) * 100;
    result.innerHTML = pred
      ? '<span class="badge badge-danger">At Risk</span>'
      : '<span class="badge badge-success">Not at Risk</span>';
    result.innerHTML += ' <small class="text-muted">融合概率：' + p.toFixed(1) + '%'
      + '（MRI：' + (isNaN(pmri)?'—':pmri.toFixed(1)+'%')
      + '，XGB：' + (isNaN(pxgb)?'—':pxgb.toFixed(1)+'%') + '）</small>';
    if (data.mri_message) result.innerHTML += '<div class="text-warning small">MRI: ' + data.mri_message + '</div>';
    if (data.xgb_message) result.innerHTML += '<div class="text-warning small">XGB: ' + data.xgb_message + '</div>';
  } catch (err) {
    result.textContent = '错误：' + err.message;
  }
});
</script>
</body>
</html>
